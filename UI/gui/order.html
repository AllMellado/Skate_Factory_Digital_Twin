<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order a skateboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 460px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  label { display: block; margin-top: .9rem; font-weight: 600; font-size: .9rem; }
  input, select, button { width: 100%; padding: .55rem; margin-top: .25rem; font-size: 1rem; box-sizing: border-box; }
  .row { display: flex; gap: .5rem; } .row > div { flex: 1; }
  button { margin-top: 1.2rem; cursor: pointer; }
  #result { margin-top: 1.2rem; padding: .8rem; background: #f2f4f7; border-radius: 6px; display: none; white-space: pre-wrap; }
  small { color: #666; font-weight: 400; }
</style>
</head>
<body>
<h1>Order a skateboard</h1>
<form id="f">
  <label>Your name <input name="customer" required maxlength="60"></label>
  <div class="row">
    <div><label>Front wheels <select name="front_color"></select></label></div>
    <div><label>Rear wheels <select name="rear_color"></select></label></div>
  </div>
  <label>Torque <select name="torque"></select></label>
  <label>Deadline (ms) <small>optional</small> <input name="deadline_ms" type="number" step="1000"></label>
  <label>What matters most?
    <select name="focus">
      <option value="">Let the factory decide</option>
      <option value="balanced">Balanced</option>
      <option value="time">Fastest delivery</option>
      <option value="energy">Lowest energy use</option>
      <option value="quality">Highest quality</option>
    </select>
  </label>
  <button>Place order</button>
</form>
<div id="result"></div>

<script>
// Same origin by default; to use this page from another site: order.html?api=http://factory-host:8088
const API = new URLSearchParams(location.search).get("api") || "";
const f = document.getElementById("f"), out = document.getElementById("result");

fetch(API + "/api/options").then(r => r.json()).then(o => {
  const fill = (name, values) => values.forEach(v => f[name].add(new Option(v, v)));
  fill("front_color", o.colors); fill("rear_color", o.colors); fill("torque", o.torques);
  f.deadline_ms.placeholder = o.deadline_ms.default;
  f.deadline_ms.min = o.deadline_ms.min; f.deadline_ms.max = o.deadline_ms.max;
});

f.addEventListener("submit", async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(f));
  for (const k of ["deadline_ms", "focus"]) if (!body[k]) delete body[k];
  body.torque = Number(body.torque);
  if (body.deadline_ms) body.deadline_ms = Number(body.deadline_ms);
  show("Sending...");
  const r = await fetch(API + "/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) return show("Could not place the order: " + d.error);
  follow(d.ticket);
});

async function follow(ticket) {
  const d = await (await fetch(API + "/api/orders/" + ticket)).json();
  show("Ticket " + ticket + "\nStatus: " + d.status.replace("_", " ") +
       (d.current_station ? "\nNow at: " + d.current_station : "") +
       (d.order_id ? "\nOrder #" + d.order_id : "") + (d.reason ? "\nReason: " + d.reason : ""));
  if (d.status !== "finished" && d.status !== "rejected") setTimeout(() => follow(ticket), 2000);
}
function show(t) { out.style.display = "block"; out.textContent = t; }
</script>
</body>
</html>
